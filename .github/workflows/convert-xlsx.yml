name: Convert xlsx to json

on:
  push:
    paths:
      - 'uririn/*.xlsx'
      - 'chion/*.xlsx'
      - 'convert_xlsx_to_json.py'
  workflow_dispatch: {}

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝 openpyxl
        run: pip install openpyxl

      - name: 執行轉換
        run: python convert_xlsx_to_json.py

      - name: Commit 產出的 json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 只加入有產生出來的檔案（例如還沒建立的資料夾就略過）
          for f in uririn/streams.json uririn/songs.json chion/streams.json chion/songs.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --staged --quiet || git commit -m "自動轉換 xlsx 為 json"
          git push
